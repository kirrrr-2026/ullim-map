<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>울림 - 울산 지도</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #error {
            display: none;
            padding: 20px;
            color: #c62828;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="error"></div>

<!-- YOUR_JAVASCRIPT_KEY를 실제 JavaScript 키로 변경 -->
<!--ec55b74951bce5dd0a395776d88868d8-->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ec55b74951bce5dd0a395776d88868d8&autoload=false"></script>

<script>
    function showError(message) {
        document.getElementById("map").style.display = "none";
        const error = document.getElementById("error");
        error.style.display = "block";
        error.textContent = message;
    }

    if (typeof kakao === "undefined" || !kakao.maps) {
        showError("카카오맵 SDK를 불러오지 못했습니다. JavaScript 키와 도메인 설정을 확인하세요.");
    } else {
        kakao.maps.load(function () {
            const container = document.getElementById("map");

            const options = {
                center: new kakao.maps.LatLng(
                    35.5384,
                    129.3114
                ),
                level: 7
            };

            const map = new kakao.maps.Map(
                container,
                options
            );

            const marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(
                    35.5384,
                    129.3114
                )
            });

            marker.setMap(map);
        });
    }
</script>

</body>
</html>
