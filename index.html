<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>울림 - 울산 지도</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #error {
            display: none;
            position: absolute;
            top: 20px;
            left: 12px;
            right: 12px;
            padding: 14px;
            background: #FFFFFF;
            color: #C62828;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
        }
    </style>
</head>

<body>
<div id="map"></div>
<div id="error"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ec55b74951bce5dd0a395776d88868d8&autoload=false&libraries=services"></script>

<script>
    let map = null;
    let placeMarkers = [];
    let myLocationMarker = null;
    let myLocationCircle = null;

    const regionCenters = {
        "전체": [35.5384, 129.3114, 8],
        "남구": [35.5270, 129.3200, 7],
        "중구": [35.5680, 129.3330, 7],
        "동구": [35.5050, 129.4250, 7],
        "북구": [35.5850, 129.3600, 8],
        "울주군": [35.5400, 129.2000, 9]
    };

    function showError(message) {
        const error = document.getElementById("error");
        error.textContent = message;
        error.style.display = "block";

        if (window.UllimAndroid) {
            window.UllimAndroid.onMapError(message);
        }
    }

    function notifyReady() {
        if (window.UllimAndroid) {
            window.UllimAndroid.onMapReady();
        }
    }
    
    window.ullimMoveTo = function(latitude, longitude, level) {
        if (!map) return;

        const point = new kakao.maps.LatLng(
            latitude, longitude
        );

        map.setLevel(level);
        map.setCenter(point);
    };

    
    // 공유 사용자 수에 따른 마커 색상
    function getSharedMarkerColor(count) {
    
        if (count >= 10) {
            return "#185744";
        }
    
        if (count >= 5) {
            return "#31865D";
        }
    
        if (count >= 2) {
            return "#65AE85";
        }
    
        return "#A8D5BA";
    }
    
    // 공유 사용자 수에 따른 숫자 색상
    function getSharedMarkerTextColor(count) {
    
        if (count < 5) {
            return "#123D2F";
        }
    
        return "#FFFFFF";
    }

    
    window.ullimShowPlaces = function(places, region) {
        if (!map) return;

        // 이전 마커 삭제
        placeMarkers.forEach(function(marker) {
            marker.setMap(null);
        });

        placeMarkers = [];

        // 새 장소 마커 생성
        places.forEach(function(place) {
            const position = new kakao.maps.LatLng(
                place.latitude,
                place.longitude
            );

            const options = {
                position: position,
                title: place.name,
                map: map
            };
            
            if (place.cloud === true) {
            
                // 고유 공유 사용자 수
                const rawCount = Number(place.uniqueUserCount);
            
                const count = Number.isFinite(rawCount)
                    ? Math.max(0, Math.floor(rawCount))
                    : 0;
            
                // 사용자 수에 따른 색상
                const markerColor = getSharedMarkerColor(count);
                const textColor = getSharedMarkerTextColor(count);
            
                // 숫자가 너무 길어지는 경우 처리
                const countLabel = count > 99
                    ? "99+"
                    : String(count);
            
                const fontSize = countLabel.length >= 3
                    ? 10
                    : 15;
            
                // 사용자 등록 장소 마커 SVG
                const svg = `
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="36"
                         height="46"
                         viewBox="0 0 36 46">
            
                        <path
                            d="M18 45
                               C13 35 1 25 1 18
                               A17 17 0 0 1 35 18
                               C35 25 23 35 18 45Z"
                            fill="${markerColor}"
                            stroke="#FFFFFF"
                            stroke-width="1.5"/>
            
                        <text
                            x="18"
                            y="18"
                            text-anchor="middle"
                            dominant-baseline="central"
                            font-family="Arial, sans-serif"
                            font-size="${fontSize}"
                            font-weight="bold"
                            fill="${textColor}">${countLabel}</text>
            
                    </svg>
                `;
            
                options.image = new kakao.maps.MarkerImage(
                    "data:image/svg+xml;charset=UTF-8,"
                        + encodeURIComponent(svg),
            
                    new kakao.maps.Size(36, 46),
            
                    {
                        offset: new kakao.maps.Point(18, 45)
                    }
                );
            }

            const marker = new kakao.maps.Marker(options);

            kakao.maps.event.addListener(
                marker, "click", function() {
                    map.setLevel(4);
                    map.setCenter(position);

                    if (window.UllimAndroid) {
                        if (place.cloud === true) {
                            window.UllimAndroid.onCloudPlaceSelected(place.placeId);
                        } else {
                            window.UllimAndroid.onPlaceSelected(place.index);
                        }
                    }
                }
            );

            placeMarkers.push(marker);
        });

        if (places.length === 1) {
            window.ullimMoveTo(
                places[0].latitude,
                places[0].longitude,
                4
            );
        } else if (places.length > 1) {
            const bounds = new kakao.maps.LatLngBounds();
            places.forEach(function(place) {
                bounds.extend(new kakao.maps.LatLng(place.latitude, place.longitude));
            });
            map.setBounds(bounds, 40, 40, 40, 40);
        } else {
            const center = regionCenters[region]
                    || regionCenters["전체"];

            window.ullimMoveTo(
                center[0], center[1], center[2]
            );
        }
    };

    window.ullimSearchPlace = function(keyword, exactName) {

    if (!map) return;

    const placesService = new kakao.maps.services.Places();

    placesService.keywordSearch(keyword, function(data, status) {

        if (status === kakao.maps.services.Status.OK) {
            // 게시글에서 지도 보기로 이동한 경우
            if (exactName) {
            
                const normalize = function(name) {
                    return name.replace(/\s+/g, "").toLowerCase();
                };
            
                const exactMatches = data.filter(function(place) {
                    return normalize(place.place_name)
                        === normalize(exactName);
                });
            
                // 정확히 일치하는 장소가 하나일 경우
                if (exactMatches.length === 1) {
                    data = exactMatches;
                }
            }

            // 기존 장소 마커 제거
            placeMarkers.forEach(function(marker) {
                marker.setMap(null);
            });

            placeMarkers = [];

            const bounds = new kakao.maps.LatLngBounds();

            data.forEach(function(place) {

                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                const marker = new kakao.maps.Marker({
                    position: position,
                    title: place.place_name,
                    map: map
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                kakao.maps.event.addListener(
                    marker, "click", function() {

                        map.setLevel(4);
                        map.setCenter(position);

                        if (window.UllimAndroid) {
                            window.UllimAndroid.onSearchResult(
                                place.place_name,
                                place.road_address_name
                                    || place.address_name
                            );
                        }
                    }
                );
            });

            if (data.length === 1) {
                map.setLevel(4);
                map.setCenter(
                    new kakao.maps.LatLng(
                        Number(data[0].y),
                        Number(data[0].x)
                    )
                );
            } else {
                map.setBounds(bounds);
            }

            // 검색 결과가 하나일 경우 상세 정보 표시
            if (data.length === 1 && window.UllimAndroid) {
                window.UllimAndroid.onSearchResult(
                    data[0].place_name,
                    data[0].road_address_name
                        || data[0].address_name
                );
            }

            // 여러 장소가 검색된 경우 선택 안내
            if (data.length > 1 && window.UllimAndroid) {
                window.UllimAndroid.onSearchResult(
                    "검색 결과 " + data.length + "개",
                    "지도에서 원하는 장소를 선택해 주세요."
                );
            }

        } else {

            if (window.UllimAndroid) {
                window.UllimAndroid.onSearchEmpty();
            }
        }
    });
};

// 핫플레이스 게시글 작성용 장소 검색
window.ullimSearchSelectablePlaces = function(keyword, requestId) {

    if (!window.UllimAndroid ||
        typeof window.UllimAndroid.onPlaceSearchResults !== "function") {
        return;
    }

    const sendResults = function(results, message) {
        window.UllimAndroid.onPlaceSearchResults(
            requestId,
            JSON.stringify(results),
            message
        );
    };

    if (!map) {
        sendResults([], "지도 서비스가 준비되지 않았습니다.");
        return;
    }

    const placesService = new kakao.maps.services.Places();

    const allowedRegions = [
        "남구", "중구", "동구", "북구", "울주군"
    ];

    // 주소에서 울산 지역 자동 추출
    function extractRegion(address) {

        const parts = (address || "").trim().split(/\s+/);

        if (parts[0] !== "울산" &&
            parts[0] !== "울산광역시") {
            return "";
        }

        return allowedRegions.includes(parts[1])
            ? parts[1]
            : "";
    }

    placesService.keywordSearch(
        "울산 " + keyword,
        function(data, status) {

            if (status === kakao.maps.services.Status.ZERO_RESULT) {
                sendResults([], "검색 결과가 없습니다.");
                return;
            }

            if (status !== kakao.maps.services.Status.OK) {
                sendResults([], "장소 검색에 실패했습니다.");
                return;
            }

            const results = [];

            data.forEach(function(place) {

                const address = place.address_name || "";
                const roadAddress = place.road_address_name || "";

                const region =
                    extractRegion(address) ||
                    extractRegion(roadAddress);

                // 울산 외 지역 제외
                if (!region) return;

                const latitude = Number(place.y);
                const longitude = Number(place.x);

                if (!Number.isFinite(latitude) ||
                    !Number.isFinite(longitude) ||
                    !place.id ||
                    !place.place_name) {
                    return;
                }

                results.push({
                    kakaoPlaceId: String(place.id),
                    placeName: place.place_name,
                    address: address,
                    roadAddress: roadAddress,
                    region: region,
                    latitude: latitude,
                    longitude: longitude,
                
                    // 카카오 장소 카테고리 정보
                    categoryGroupCode: place.category_group_code || "",
                    categoryName: place.category_name || ""
                });
            });

            sendResults(
                results,
                results.length === 0
                    ? "울산 지역의 검색 결과가 없습니다."
                    : ""
            );
        },
        { size: 15 }
    );
};


// 저장된 검색어와 장소 ID를 이용한 실시간 장소 재조회
window.ullimResolvePlace = function(keyword, placeId, requestId) {

    let completed = false;

    function sendResult(result, message) {

        if (completed) return;

        completed = true;

        if (window.UllimAndroid &&
            typeof window.UllimAndroid.onPlaceResolved === "function") {

            window.UllimAndroid.onPlaceResolved(
                requestId,
                JSON.stringify(result),
                message
            );
        }
    }

    if (!map) {
        sendResult(null, "지도 서비스가 준비되지 않았습니다.");
        return;
    }

    if (!keyword || !placeId) {
        sendResult(null, "장소 식별 정보가 없습니다.");
        return;
    }

    const placesService = new kakao.maps.services.Places();

    const allowedRegions = [
        "남구",
        "중구",
        "동구",
        "북구",
        "울주군"
    ];

    // 주소에서 울산 지역 추출
    function extractRegion(address) {

        const parts = (address || "").trim().split(/\s+/);

        if (parts[0] !== "울산" &&
            parts[0] !== "울산광역시") {

            return "";
        }

        return allowedRegions.includes(parts[1])
            ? parts[1]
            : "";
    }

    // 검색 결과 처리
    function handleResults(data, status, pagination) {

        if (completed) return;

        if (status === kakao.maps.services.Status.ZERO_RESULT) {

            sendResult(null, "장소 검색 결과가 없습니다.");
            return;
        }

        if (status !== kakao.maps.services.Status.OK) {

            sendResult(null, "장소 정보 조회에 실패했습니다.");
            return;
        }

        // 저장된 장소 ID와 정확하게 일치하는 결과 검색
        const matchedPlace = data.find(function(place) {

            return String(place.id) === String(placeId);
        });

        if (matchedPlace) {

            const address = matchedPlace.address_name || "";

            const roadAddress =
                matchedPlace.road_address_name || "";

            const region =
                extractRegion(address) ||
                extractRegion(roadAddress);

            const latitude = Number(matchedPlace.y);
            const longitude = Number(matchedPlace.x);

            if (!region ||
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude) ||
                Math.abs(latitude) > 90 ||
                Math.abs(longitude) > 180) {

                sendResult(null, "유효한 울산 장소가 아닙니다.");
                return;
            }

            // 조회 결과를 Android로 전달
            sendResult({
                kakaoPlaceId: String(matchedPlace.id),
                placeName: matchedPlace.place_name,
                address: address,
                roadAddress: roadAddress,
                region: region,
                latitude: latitude,
                longitude: longitude,
            
                // 카카오 장소 카테고리 정보
                categoryGroupCode: matchedPlace.category_group_code || "",
                categoryName: matchedPlace.category_name || ""
            
            }, "");

            return;
        }

        // 첫 페이지에 없다면 다음 페이지 검색
        if (pagination && pagination.hasNextPage) {

            pagination.nextPage();

        } else {

            sendResult(null, "일치하는 장소를 찾을 수 없습니다.");
        }
    }

    // 검색 지연에 대한 예외 처리
    setTimeout(function() {

        sendResult(null, "장소 조회 시간이 초과되었습니다.");

    }, 10000);

    // 기존 장소 선택 기능과 동일한 검색 조건 사용
    try {

        placesService.keywordSearch(
            "울산 " + keyword,
            handleResults,
            { size: 15 }
        );

    } catch (error) {

        sendResult(null, "장소 검색 중 오류가 발생했습니다.");
    }
};
    
    window.ullimShowMyLocation = function(latitude, longitude) {
        if (!map) return;

        const position = new kakao.maps.LatLng(
            latitude, longitude
        );

        if (myLocationMarker) {
            myLocationMarker.setMap(null);
        }

        if (myLocationCircle) {
            myLocationCircle.setMap(null);
        }

        myLocationMarker = new kakao.maps.Marker({
            position: position,
            title: "내 위치",
            map: map
        });

        myLocationCircle = new kakao.maps.Circle({
            center: position,
            radius: 30,
            strokeWeight: 2,
            strokeColor: "#185744",
            strokeOpacity: 0.8,
            fillColor: "#4DAA89",
            fillOpacity: 0.2,
            map: map
        });

        window.ullimMoveTo(latitude, longitude, 3);
    };

    if (typeof kakao === "undefined" || !kakao.maps) {
        showError(
            "카카오맵 SDK를 불러오지 못했습니다. "
            + "JavaScript 키와 도메인을 확인하세요."
        );
    } else {
        kakao.maps.load(function() {
            try {
                map = new kakao.maps.Map(
                    document.getElementById("map"),
                    {
                        center: new kakao.maps.LatLng(
                            35.5384, 129.3114
                        ),
                        level: 8
                    }
                );

                map.setDraggable(true);
                map.setZoomable(true);

                // 웹브라우저에서 직접 열었을 때도
                // 기본 장소 7곳 표시
                if (!window.UllimAndroid) {
                    window.ullimShowPlaces([
                        {
                            index: 0,
                            name: "울산대공원",
                            latitude: 35.5270,
                            longitude: 129.2890
                        },
                        {
                            index: 1,
                            name: "태화강 국가정원",
                            latitude: 35.5500,
                            longitude: 129.2960
                        },
                        {
                            index: 2,
                            name: "장생포 고래문화마을",
                            latitude: 35.5020,
                            longitude: 129.3800
                        },
                        {
                            index: 3,
                            name: "대왕암공원",
                            latitude: 35.4910,
                            longitude: 129.4390
                        },
                        {
                            index: 4,
                            name: "강동 몽돌해변",
                            latitude: 35.6290,
                            longitude: 129.4400
                        },
                        {
                            index: 5,
                            name: "간절곶",
                            latitude: 35.3590,
                            longitude: 129.3600
                        },
                        {
                            index: 6,
                            name: "반구대 암각화",
                            latitude: 35.5990,
                            longitude: 129.1690
                        }
                    ], "전체");
                }

                notifyReady();

            } catch (e) {
                showError("지도 초기화 오류: " + e.message);
            }
        });
    }
</script>
</body>
</html>
